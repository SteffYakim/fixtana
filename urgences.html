<script>
  const SUPABASE_URL = 'https://xfqzlifauzlmtzaidixb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmcXpsaWZhdXpsbXR6YWlkaXhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTkxMTIsImV4cCI6MjEwMTMzNTExMn0.AmBdkYq70S9QntL13EcmFSJaxASh-x4gu6T1Mkhxsvk'; // ⚠️ Mettez votre clé anon public

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function chargerPharmacies() {
    // Récupérer les pharmacies de garde
    const { data, error } = await supabaseClient
      .from('pharmacies')
      .select('*')
      .eq('est_de_garde', true)
      .order('quartier', { ascending: true });

    const conteneur = document.getElementById('liste-pharmacies');
    conteneur.innerHTML = '';

    if (error || !data || data.length === 0) {
      conteneur.innerHTML = '<div class="empty-state">Aucune pharmacie de garde répertoriée pour le moment.</div>';
      return;
    }

    const aujourdhui = new Date();
    aujourdhui.setHours(0, 0, 0, 0);

    data.forEach(p => {
      // Filtrer ou vérifier si la date de fin n'est pas dépassée
      let dateFinStr = '';
      if (p.date_fin_garde) {
        const dateFin = new Date(p.date_fin_garde);
        // Si la garde est expirée depuis plus d'un jour, on saute ou on l'indique
        const parts = p.date_fin_garde.split('-');
        dateFinStr = ` (Jusqu'au ${parts[2]}/${parts[1]}/${parts[0]})`;
      }

      const card = document.createElement('div');
      card.className = 'pharmacie-card';
      card.innerHTML = `
        <div class="pharmacie-name">🟢 ${p.nom} ${dateFinStr}</div>
        <div class="pharmacie-meta">
          📍 <strong>Quartier :</strong> ${p.quartier} ${p.adresse ? `(${p.adresse})` : ''}
        </div>
        ${p.telephone ? `<a href="tel:${p.telephone}" class="btn-call-pharmacie">📞 Appeler (${p.telephone})</a>` : ''}
      `;
      conteneur.appendChild(card);
    });
  }

  chargerPharmacies();
</script>
