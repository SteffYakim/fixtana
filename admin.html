<!-- SECTION PHARMACIES DANS ADMIN -->
<div class="card">
  <h2>💊 Gestion des Pharmacies de Garde</h2>
  
  <!-- Formulaire d'ajout rapide -->
  <form id="form-pharmacie" onsubmit="ajouterPharmacie(event)" style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
    <input type="text" id="ph-nom" placeholder="Nom (ex: Pharmacie Métropole)" required style="flex:2; padding: 8px;">
    <input type="text" id="ph-quartier" placeholder="Quartier (ex: Analakely)" required style="flex:1; padding: 8px;">
    <input type="tel" id="ph-tel" placeholder="Téléphone" style="flex:1; padding: 8px;">
    <button type="submit" class="btn btn-validate">+ Ajouter</button>
  </form>

  <!-- Tableau des pharmacies -->
  <table>
    <thead>
      <tr>
        <th>Pharmacie</th>
        <th>Quartier</th>
        <th>Téléphone</th>
        <th>De garde ?</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="pharmacies-table-body">
      <!-- Rempli en JS -->
    </tbody>
  </table>
</div>
